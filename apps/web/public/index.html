<!doctype html>
<html lang="ko" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlphaMan - AI 하이라이트 쇼츠 자동 제작 · AI 자막 편집기</title>
  <meta name="description" content="링크만 입력하면 롱폼 영상을 여러 편의 쇼츠로. AI 기반 자막 생성 및 편집, 음성 인식, 의미 기반 분할, 다국어 번역을 원클릭으로. YouTube Shorts, TikTok, Reels 크리에이터를 위한 최적의 솔루션." />
  <meta name="keywords" content="자막 생성,AI 자막,음성 인식,STT,자동 자막,숏폼 편집,YouTube Shorts,TikTok,Reels,영상 편집,자막 편집기,다국어 번역,subtitle generator,video editor,쇼츠 자동 제작,하이라이트" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&family=Jua&family=Do+Hyeon&family=Gasoek+One&family=Gowun+Dodum&family=Dongle:wght@700&family=Gaegu:wght@700&family=Nanum+Gothic:wght@400;800&family=IBM+Plex+Sans+KR:wght@700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function(){try{var t=localStorage.getItem('am_theme')||'system';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="사이드바">
      <div class="sidebar-head">
        <a href="#/" class="brand"><span class="brand-mark">α</span><span class="brand-name">AlphaMan</span></a>
        <button class="icon-btn" id="sidebar-toggle" aria-label="사이드바 토글" title="사이드바 토글 (Ctrl+B)">☰</button>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="sidebar-open" aria-label="메뉴 열기">☰</button>
        <div id="topbar-title" class="topbar-title"></div>
        <div class="topbar-actions">
          <span id="platform-badge" class="badge badge-soft"></span>
          <button class="icon-btn" id="theme-btn" aria-label="테마 변경" title="테마 변경 (Ctrl+Shift+L)">◐</button>
          <button class="icon-btn" id="notif-btn" aria-label="알림" title="Notifications alt+T">🔔<span id="notif-count" class="pill hidden"></span></button>
          <button class="icon-btn" id="feedback-btn" aria-label="의견 보내기" title="의견 보내기">✎</button>
          <button class="btn btn-primary btn-sm" id="pixie-btn" aria-label="챗봇 열기" title="픽시 열기 (Ctrl+K)">✦ 픽시</button>
          <div id="user-menu"></div>
        </div>
      </header>
      <div id="notice-bar" class="notice-bar hidden"></div>
      <main id="view" class="view" tabindex="-1"></main>
      <footer id="footer" class="footer"></footer>
    </div>
  </div>

  <div id="drawer-notifs" class="drawer hidden" role="dialog" aria-label="알림">
    <div class="drawer-head"><strong>알림</strong><div><button class="btn btn-ghost btn-sm" id="notif-read-all">모두 읽음</button><button class="icon-btn" data-close="drawer-notifs" aria-label="닫기">✕</button></div></div>
    <div id="notif-list" class="drawer-body"></div>
  </div>

  <div id="drawer-pixie" class="drawer drawer-wide hidden" role="dialog" aria-label="픽시 커맨드 센터">
    <div class="drawer-head"><div><strong>✦ 픽시</strong><div class="muted small">채팅으로 작업을 시작하고, 필요한 순간에만 편집기로 이어지는 픽시 커맨드 센터.</div></div><button class="icon-btn" data-close="drawer-pixie" aria-label="닫기">✕</button></div>
    <div id="pixie-messages" class="drawer-body chat-body"><div class="muted">픽시를 여는 중...</div></div>
    <form id="pixie-form" class="chat-form">
      <input id="pixie-input" placeholder="무엇을 도와드릴까요? 예) 이 영상으로 쇼츠 만들어줘" autocomplete="off" />
      <button class="btn btn-primary" type="submit">보내기</button>
    </form>
    <div class="chat-tools"><button class="btn btn-ghost btn-sm" id="pixie-escalate">관리자에게 전달</button><span class="muted small">답변은 이 채팅에서 확인할 수 있으며 최대 24시간이 걸릴 수 있습니다.</span></div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="backdrop" class="backdrop hidden"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
